<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background Color -->
  <rect width="100%" height="100%" fill="#1a1a1a" />

  <g fill="#e78895">
    <!-- Three Sparkle Stars -->
    <!-- Top Star -->
    <path d="M540,80 Q540,95 555,95 Q540,95 540,110 Q540,95 525,95 Q540,95 540,80 Z" />
    <!-- Right Star -->
    <path d="M600,100 Q600,112 612,112 Q600,112 600,124 Q600,112 588,112 Q600,112 600,100 Z" />
    <!-- Bottom Star -->
    <path d="M580,135 Q580,145 590,145 Q580,145 580,155 Q580,145 570,145 Q580,145 580,135 Z" />

    <!-- House Structure -->
    <!-- Main Roof Outline -->
    <path d="M460,110 L560,205 L525,205 L460,142 L345,250 L320,250 Z" />
    <!-- Chimney -->
    <rect x="395" y="150" width="28" height="60" />
    <!-- Under Roof Fill / Attic Area -->
    <path d="M460,155 L510,205 L410,205 Z" />
    
    <!-- Window Frame & 4 Panes -->
    <!-- Outer Window Frame Outline -->
    <rect x="440" y="215" width="40" height="40" rx="2" />
    <!-- Window Panes (Cutouts by using background color block style) -->
    <rect x="443" y="218" width="15" height="15" fill="#1a1a1a" />
    <rect x="462" y="218" width="15" height="15" fill="#1a1a1a" />
    <rect x="443" y="237" width="15" height="15" fill="#1a1a1a" />
    <rect x="462" y="237" width="15" height="15" fill="#1a1a1a" />

    <!-- Broom Handle & Swoosh Element -->
    <!-- Broom Handle -->
    <path d="M570,240 L665,145 L680,160 L585,255 Z" />
    <!-- Broom Base Holder -->
    <path d="M560,230 C575,235 590,250 580,265 C570,270 550,250 560,230 Z" />
    
    <!-- Dynamic Curved Cleaning Swoosh Base -->
    <path d="M220,290 C340,240 460,340 590,260 C530,305 400,325 310,295 C270,280 240,285 220,290 Z" />
    <path d="M300,282 C380,250 480,310 575,268 C520,300 420,310 300,282 Z" opacity="0.8" />
  </g>

  <!-- Typography: Styled Script Text for "Hassina's" -->
  <text x="50%" y="420" 
        font-family="'Monsieur La Doulaise', 'Great Vibes', 'Brush Script MT', 'Calligraphy', cursive" 
        font-size="145" 
        font-weight="bold"
        fill="#e78895" 
        text-anchor="middle" 
        letter-spacing="2">Hassina's</text>
</svg>
